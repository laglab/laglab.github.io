plugins { id 'com.android.application' }

// Die Versionsnummer kommt aus der Web-App, damit Android und Web dieselbe Zählung haben
// Die normale App zählt mit Punkt, etwa 1.1. Seit dem Neubeginn bei v1 nach v3.7 kommt 1000 dazu,
// damit Android jede neue Version als neuer erkennt als die alten. Aus 1 wird 1100, aus 1.1 wird 1101, aus 2 wird 1200.
// Bis v3.7 galt ohne Zuschlag 307.
// Ordner der Web-Apps: die normale App liegt im Hauptordner dieses Projekts (LagLab),
// die Test-App in einem eigenen Projektordner LagLab-Test daneben.
ext.WEB = [normal: '../..', labtest: '../../../LagLab-Test']
def webVersion(String flavor) {
    def m = (file("${WEB[flavor]}/app.js").getText('UTF-8') =~ /APP_VERSION = '([\d.]+)'/)
    return m[0][1]
}
def webCode(String flavor) {
    def p = webVersion(flavor).tokenize('.')
    return flavor == 'normal' ? 1000 + (p[0] as int) * 100 + (p.size() > 1 ? p[1] as int : 0) : (p[0] as int)
}
// Nur die Dateien der Web-App kommen in die APK, nicht Android-Teil, APKs, Grafiken oder Notizen.
// Sie werden vor jedem Bau in build/web/<Variante> kopiert.
ext.WEB_FILES = ['index.html', '*.js', '*.css', 'manifest.webmanifest', 'icon-*.png']
WEB.each { flavor, dir ->
    def copy = tasks.register("copyWeb${flavor.capitalize()}", Sync) {
        from(dir) { include WEB_FILES }
        into layout.buildDirectory.dir("web/${flavor}")
    }
    tasks.named('preBuild') { dependsOn copy }
}

android {
    namespace 'de.laglab'
    compileSdk 36
    defaultConfig {
        minSdk 29
        targetSdk 36
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
    flavorDimensions = ['variant']
    productFlavors {
        // Test-App aus dem Projektordner LagLab-Test
        labtest {
            dimension 'variant'
            applicationId 'de.laglab.test'
            versionCode webCode('labtest')
            versionName "Stand ${webVersion('labtest')}"
            resValue 'string', 'app_name', 'Lag Lab Test'   // Name unter dem Symbol, mit Leerzeichen
        }
        // Normale App aus dem Hauptordner dieses Projekts, wird erst nach einer Übernahme gebaut
        normal {
            dimension 'variant'
            applicationId 'de.laglab.app'
            versionCode webCode('normal')
            versionName "v${webVersion('normal')}"
            resValue 'string', 'app_name', 'Lag Lab'   // Name unter dem Symbol, mit Leerzeichen
        }
    }
    sourceSets {
        labtest { assets.srcDirs = [layout.buildDirectory.dir('web/labtest')] }
        normal { assets.srcDirs = [layout.buildDirectory.dir('web/normal')] }
    }
    // Der Schlüssel liegt außerhalb des Projekts, die Angaben stehen in ~/.gradle/gradle.properties
    signingConfigs {
        release {
            if (project.hasProperty('LAGLAB_KEYSTORE')) {
                storeFile file(LAGLAB_KEYSTORE)
                storePassword LAGLAB_STORE_PASSWORD
                keyAlias LAGLAB_KEY_ALIAS
                keyPassword LAGLAB_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { resValues true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.herohan:UVCAndroid:1.0.13'
    implementation 'androidx.webkit:webkit:1.17.1'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
